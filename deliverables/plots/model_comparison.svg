<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison des modeles testes</title>
  <desc id="desc">Comparaison des scores recall exacts et ROC AUC exacts pour six modeles.</desc>
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1E1E1E">Comparaison des modèles testés</text>
  <text x="60" y="86" font-family="Arial, sans-serif" font-size="15" fill="#666666">Scores moyens en validation croisée issus du benchmark notebook</text>
  <line x1="95" y1="460" x2="900" y2="460" stroke="#D6D6E7" stroke-width="2"/>
  <line x1="95" y1="140" x2="95" y2="460" stroke="#D6D6E7" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#666666">
    <text x="76" y="464" text-anchor="end">0.0</text>
    <text x="76" y="304" text-anchor="end">0.5</text>
    <text x="76" y="144" text-anchor="end">1.0</text>
  </g>
  <g stroke="#EEF0FA" stroke-width="1">
    <line x1="95" y1="300" x2="900" y2="300"/>
    <line x1="95" y1="140" x2="900" y2="140"/>
  </g>
  <g>
    <rect x="130" y="355.47" width="32" height="104.53" fill="#E1000F"/><rect x="166" y="185.92" width="32" height="274.08" fill="#000091"/>
    <rect x="250" y="238.74" width="32" height="221.26" fill="#E1000F"/><rect x="286" y="193.58" width="32" height="266.42" fill="#000091"/>
    <rect x="370" y="328.65" width="32" height="131.35" fill="#E1000F"/><rect x="406" y="185.87" width="32" height="274.13" fill="#000091"/>
    <rect x="490" y="378.32" width="32" height="81.68" fill="#E1000F"/><rect x="526" y="183.68" width="32" height="276.32" fill="#000091"/>
    <rect x="610" y="437.45" width="32" height="22.55" fill="#E1000F"/><rect x="646" y="177.70" width="32" height="282.30" fill="#000091"/>
    <rect x="730" y="387.16" width="32" height="72.84" fill="#E1000F"/><rect x="766" y="274.68" width="32" height="185.32" fill="#000091"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#E1000F" text-anchor="middle" font-weight="700">
    <text x="146" y="347">0.327</text>
    <text x="266" y="230">0.691</text>
    <text x="386" y="320">0.410</text>
    <text x="506" y="370">0.255</text>
    <text x="626" y="429">0.070</text>
    <text x="746" y="379">0.228</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#000091" text-anchor="middle" font-weight="700">
    <text x="182" y="178">0.857</text>
    <text x="302" y="186">0.833</text>
    <text x="422" y="178">0.857</text>
    <text x="542" y="176">0.863</text>
    <text x="662" y="170">0.882</text>
    <text x="782" y="267">0.579</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#1E1E1E" text-anchor="middle">
    <text x="164" y="500">AdaBoost</text>
    <text x="284" y="500">LogReg</text>
    <text x="404" y="500">SVM</text>
    <text x="524" y="500">Gradient</text>
    <text x="644" y="500">Random</text>
    <text x="764" y="500">Decision</text>
